jobs:
  probe:
    name: probe-${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@main
      - name: Time a from-scratch build with gzip and with zstd layers
        run: |
          for layers in gzip zstd; do
            docker builder prune -af > /dev/null
            docker image prune -af > /dev/null
            if [ "$layers" = gzip ]; then
              set -- -t probe:latest
            else
              set -- --output type=image,name=probe:latest,compression=zstd,unpack=true
            fi
            start=$(date +%s)
            docker build --progress=plain --no-cache "$@" . > "/tmp/$layers.log" 2>&1
            echo "$layers build $(( $(date +%s) - start ))s"
            grep -E '^#[0-9]+ (exporting layers|unpacking|DONE [0-9.]+s$)' "/tmp/$layers.log" | tail -4
            docker run --rm probe:latest sh -c '"target/$(uname -m)-unknown-linux-musl/release/rustyhgm-coding-harness" --help | head -1'
            docker image ls probe --format '{{.Size}}'
          done
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86-64
            runner: ubuntu-latest
          - platform: linux-arm64
            runner: ubuntu-26.04-arm
name: harness-layers-probe
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/harness-layers-probe.yml
