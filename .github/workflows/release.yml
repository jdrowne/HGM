---
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}
defaults:
  run:
    shell: bash
env:
  CARGO_TERM_COLOR: always
jobs:
  agent-subtree:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@main
      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build and test the agent subtree on its own
        run: test/agent-subtree.sh
  assert-file-and-registration-sets-agree:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@main
      - name: Check every test file is built and every registration has a file
        run: |
          fail=0
          for dir in $(find test/src -name '*.rs' -exec dirname {} \; | sort -u)
          do
            if [ ! -f "$dir/main.rs" ]; then
              echo "::error file=$dir::$dir holds Rust files but no main.rs," \
                "so none of them is built; add $dir/main.rs and register it"
              fail=1
            fi
          done
          for main in $(find test/src -name main.rs | sort)
          do
            dir=${main%/main.rs}
            rest=${dir#test/src/}
            manifest=src/${rest%%/*}/Cargo.toml
            if ! grep -qxF "path = \"../../$main\"" "$manifest"; then
              echo "::error file=$main::$main is never built; add a [[test]]" \
                "with path = \"../../$main\" to $manifest, or delete it"
              fail=1
            fi
            for f in "$dir"/*.rs
            do
              name=$(basename "$f" .rs)
              if [ "$name" != main ] && ! grep -qxE "(pub )?mod $name;" "$main"; then
                echo "::error file=$f::$f is never compiled; add" \
                  "'mod $name;' to $main, or delete it"
                fail=1
              fi
            done
          done
          for manifest in src/*/Cargo.toml
          do
            for path in $(sed -nE 's#^path = "\.\./\.\./(test/[^"]+)"$#\1#p' "$manifest")
            do
              if [ ! -f "$path" ]; then
                echo "::error file=$manifest::$manifest registers $path," \
                  "but it does not exist"
                fail=1
              fi
            done
          done
          exit $fail
  assert-no-comments:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@main
      - name: Assert no comments
        uses: 10U-Labs/assert-no-comments@latest
        with:
          trees: .claude/statusline.sh .github/workflows/release.yml config.yaml etc src test
          verbose: "true"
  assert-no-empty-test-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@main
      - name: Check no test file is empty of tests
        run: |
          fail=0
          for f in $(find test/src -name '*.rs' -not -name main.rs -not -name common.rs)
          do
            if ! grep -q '#\[test\]' "$f"; then
              echo "::error file=$f::$f has no #[test] functions; delete" \
                "the file and its mod declaration"
              fail=1
            fi
          done
          exit $fail
  assert-no-inline-directives:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@main
      - name: Assert no inline lint or format directives in Rust
        run: |
          fail=0
          pattern='#!?\[(allow|expect|warn|deny|forbid|rustfmt::skip)\b|#!?\[cfg_attr\('
          while IFS=: read -r f n text
          do
            echo "::error file=$f,line=$n::$f sets a lint level or skips" \
              "rustfmt inline; lint levels live in Cargo.toml and" \
              "thresholds in etc/clippy, so fix the code instead"
            fail=1
          done < <(grep -rnE --include='*.rs' "$pattern" src test lib || true)
          exit $fail
  assert-no-linter-config-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@main
      - name: Install tools
        run: pip install assert-no-linter-config-files
      - if: ${{ !cancelled() }}
        name: Assert no linter config files
        run: >-
          assert-no-linter-config-files
          --linters mypy,pylint,yamllint
          --verbose
          ${{ github.workspace }}
      - if: ${{ !cancelled() }}
        name: Assert no rustfmt or clippy config outside etc/clippy
        run: |
          fail=0
          for f in $(find . -path ./.git -prune -o -path ./target -prune -o \
                       \( -name rustfmt.toml -o -name .rustfmt.toml \
                          -o -name clippy.toml -o -name .clippy.toml \) -print)
          do
            case "$f" in
              ./etc/clippy/src/clippy.toml|./etc/clippy/test/clippy.toml) ;;
              *)
                echo "::error file=$f::$f configures a Rust linter or" \
                  "formatter; rustfmt runs with the Rust Style Guide defaults," \
                  "and clippy thresholds live only in etc/clippy"
                fail=1
                ;;
            esac
          done
          exit $fail
  assert-no-oversized-source-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@main
      - name: Check file line limits
        run: |
          fail=0
          for f in $(find src test lib -name '*.rs')
          do
            lines=$(wc -l < "$f" | tr -d " ")
            if [ "$lines" -ge 950 ]; then
              echo "::error file=$f,line=$lines::$f has $lines lines (max 949); split it before adding to it"
              fail=1
            fi
          done
          exit $fail
  build:
    name: build-${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@main
      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache the build
        uses: Swatinem/rust-cache@master
        with:
          key: ${{ matrix.platform }}
      - name: Install cargo-nextest
        uses: taiki-e/install-action@main
        with:
          tool: cargo-nextest
      - name: Build every test binary into an archive
        run: cargo nextest archive --workspace --all-targets --archive-file build.tar.zst
      - name: Upload build
        uses: actions/upload-artifact@main
        with:
          name: build-${{ matrix.platform }}
          path: build.tar.zst
          retention-days: 1
      - name: Build the release binaries
        run: cargo build --workspace --bins --release
      - name: Stage the release binaries
        run: |
          ext=""
          if [ "$RUNNER_OS" = Windows ]; then ext=.exe; fi
          mkdir dist
          for bin in hgm hgm-agent; do
            cp "target/release/$bin$ext" "dist/$bin-${{ matrix.platform }}$ext"
          done
      - name: Upload the release binaries
        uses: actions/upload-artifact@main
        with:
          name: release-${{ matrix.platform }}
          path: dist/
          retention-days: 1
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86-64
            runner: ubuntu-latest
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: macos-arm64
            runner: macos-latest
          - platform: windows-x86-64
            runner: windows-latest
          - platform: windows-arm64
            runner: windows-11-arm
  clippy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@main
      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache the build
        uses: Swatinem/rust-cache@master
      - env:
          CLIPPY_CONF_DIR: ${{ github.workspace }}/etc/clippy/src
        if: ${{ !cancelled() }}
        name: Run clippy on src with the src thresholds
        run: cargo clippy --workspace --lib --bins -- -D warnings
      - env:
          CLIPPY_CONF_DIR: ${{ github.workspace }}/etc/clippy/test
        if: ${{ !cancelled() }}
        name: Run clippy on test with the test thresholds
        run: cargo clippy --workspace --tests -- -D warnings
  e2e-test:
    name: e2e-test-${{ matrix.platform }}
    needs: build
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@main
      - name: Download build
        uses: actions/download-artifact@main
        with:
          name: build-${{ matrix.platform }}
      - name: Install cargo-nextest
        uses: taiki-e/install-action@main
        with:
          tool: cargo-nextest
      - name: Run the e2e tier
        run: >-
          cargo-nextest nextest run
          --archive-file build.tar.zst
          --workspace-remap .
          -E 'binary(e2e)'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86-64
            runner: ubuntu-latest
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
  integration-test:
    name: integration-test-${{ matrix.platform }}
    needs: build
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@main
      - name: Download build
        uses: actions/download-artifact@main
        with:
          name: build-${{ matrix.platform }}
      - name: Install cargo-nextest
        uses: taiki-e/install-action@main
        with:
          tool: cargo-nextest
      - name: Run the integration tier
        run: >-
          cargo-nextest nextest run
          --archive-file build.tar.zst
          --workspace-remap .
          -E 'binary(integration)'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86-64
            runner: ubuntu-latest
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
  release:
    if: >-
      github.ref_name == 'main'
      && github.event_name == 'push'
    needs:
      - agent-subtree
      - assert-file-and-registration-sets-agree
      - assert-no-comments
      - assert-no-empty-test-files
      - assert-no-inline-directives
      - assert-no-linter-config-files
      - assert-no-oversized-source-files
      - clippy
      - e2e-test
      - integration-test
      - rustfmt
      - unit-test
      - yamllint
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@main
        with:
          fetch-depth: 0
      - name: Download the release binaries
        uses: actions/download-artifact@main
        with:
          merge-multiple: true
          path: dist/
          pattern: release-*
      - id: version
        name: Generate version from UTC time
        run: >-
          echo "version=$(date -u +%Y%m%d%H%M%S)"
          >> $GITHUB_OUTPUT
      - name: Create tag
        run: >-
          git tag
          "v${{ steps.version.outputs.version }}"
      - name: Push tag
        run: >-
          git push origin
          "v${{ steps.version.outputs.version }}"
      - env:
          GH_TOKEN: ${{ github.token }}
        name: Create GitHub Release
        run: |
          gh release create \
            "v${{ steps.version.outputs.version }}" \
            --generate-notes \
            dist/*
      - name: Update latest tag
        run: |
          git tag -f latest
          git push origin latest --force
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@main
      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all --check
  unit-test:
    name: unit-test-${{ matrix.platform }}
    needs: build
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@main
      - name: Download build
        uses: actions/download-artifact@main
        with:
          name: build-${{ matrix.platform }}
      - name: Install cargo-nextest
        uses: taiki-e/install-action@main
        with:
          tool: cargo-nextest
      - name: Run the unit tier
        run: >-
          cargo-nextest nextest run
          --archive-file build.tar.zst
          --workspace-remap .
          --no-tests warn
          -E 'kind(lib) | kind(bin) | binary(unit)'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86-64
            runner: ubuntu-latest
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: macos-arm64
            runner: macos-latest
          - platform: windows-x86-64
            runner: windows-latest
          - platform: windows-arm64
            runner: windows-11-arm
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@main
      - name: Install tools
        run: pip install assert-no-inline-directives yamllint
      - if: ${{ !cancelled() }}
        name: Assert no inline yamllint disables
        run: >-
          assert-no-inline-directives
          --tools yamllint
          --verbose
          .github/workflows/release.yml
      - if: ${{ !cancelled() }}
        name: Lint YAML
        run: |
          EMPTY='empty-lines: {max: 0, max-start: 0, max-end: 1}'
          KEY='key-ordering: enable'
          LL='line-length: disable'
          NL='new-line-at-end-of-file: enable'
          TR='truthy: {allowed-values: ["true", "false", "on"]}'
          RULES="$EMPTY, $KEY, $LL, $NL, $TR"
          yamllint --strict \
            --config-data \
            "{extends: default, rules: {$RULES}}" \
            .github/workflows/release.yml
name: release
on:
  push:
    branches: [main]
    paths:
      - .claude/statusline.sh
      - .dockerignore
      - .github/workflows/release.yml
      - Cargo.toml
      - Dockerfile
      - config.yaml
      - etc/**
      - lib/**
      - rust-toolchain.toml
      - src/**
      - test/**
  workflow_dispatch: {}
