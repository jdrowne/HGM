---
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}
defaults:
  run:
    shell: bash
env:
  CARGO_TERM_COLOR: always
jobs:
  assert-coverage:
    needs:
      - e2e-test-coverage
      - integration-test-coverage
      - unit-test-coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@main
      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@main
        with:
          tool: cargo-llvm-cov
      - name: Download the instrumented build
        uses: actions/download-artifact@main
        with:
          name: build-coverage
      - name: Unpack the instrumented binaries where the report looks for them
        run: |
          mkdir -p target/llvm-cov-target
          tar --zstd -xf build-coverage.tar.zst -C target/llvm-cov-target
      - name: Download the profile data of every tier
        uses: actions/download-artifact@main
        with:
          merge-multiple: true
          path: target/llvm-cov-target/
          pattern: profraw-*
      - if: ${{ !cancelled() }}
        name: Generate the coverage report
        run: >-
          cargo llvm-cov report
          --nextest-archive-file build-coverage.tar.zst
          --ignore-filename-regex '(^|/)test/'
          --html
          --output-dir coverage-html
      - if: ${{ !cancelled() }}
        name: Upload the coverage report
        uses: actions/upload-artifact@main
        with:
          name: coverage-html
          path: coverage-html/
      - name: Enforce 100% coverage
        run: |
          cargo llvm-cov report \
            --nextest-archive-file build-coverage.tar.zst \
            --ignore-filename-regex '(^|/)test/' \
            --show-missing-lines
          cargo llvm-cov report \
            --nextest-archive-file build-coverage.tar.zst \
            --ignore-filename-regex '(^|/)test/' \
            --json \
            --summary-only \
            | jq -e '.data[0].totals |
              .lines.covered == .lines.count and
              .functions.covered == .functions.count and
              .regions.covered == .regions.count' \
            || { echo "FAIL: line, function and region coverage must be 100%"; exit 1; }
  assert-file-and-registration-sets-agree:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@main
      - name: Check every test file is built and every registration has a file
        run: |
          fail=0
          for dir in $(find test/src -name '*.rs' -exec dirname {} \; | sort -u)
          do
            if [ ! -f "$dir/main.rs" ]; then
              echo "::error file=$dir::$dir holds Rust files but no main.rs," \
                "so none of them is built; add $dir/main.rs and register it"
              fail=1
            fi
          done
          for main in $(find test/src -name main.rs | sort)
          do
            dir=${main%/main.rs}
            rest=${dir#test/src/}
            manifest=src/${rest%%/*}/Cargo.toml
            if ! grep -qxF "path = \"../../$main\"" "$manifest"; then
              echo "::error file=$main::$main is never built; add a [[test]]" \
                "with path = \"../../$main\" to $manifest, or delete it"
              fail=1
            fi
            for f in "$dir"/*.rs
            do
              name=$(basename "$f" .rs)
              if [ "$name" != main ] && ! grep -qxE "(pub )?mod $name;" "$main"; then
                echo "::error file=$f::$f is never compiled; add" \
                  "'mod $name;' to $main, or delete it"
                fail=1
              fi
            done
          done
          for manifest in src/*/Cargo.toml
          do
            for path in $(sed -nE 's#^path = "\.\./\.\./(test/[^"]+)"$#\1#p' "$manifest")
            do
              if [ ! -f "$path" ]; then
                echo "::error file=$manifest::$manifest registers $path," \
                  "but it does not exist"
                fail=1
              fi
            done
          done
          exit $fail
  assert-no-comments:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@main
      - name: Assert no comments
        uses: 10U-Labs/assert-no-comments@latest
        with:
          trees: .github/actions .github/workflows/release.yml etc src test
          verbose: "true"
  assert-no-empty-test-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@main
      - name: Check no test file is empty of tests
        run: |
          fail=0
          for f in $(find test/src -name '*.rs' -not -name main.rs -not -name common.rs)
          do
            if ! grep -q '#\[test\]' "$f"; then
              echo "::error file=$f::$f has no #[test] functions; delete" \
                "the file and its mod declaration"
              fail=1
            fi
          done
          exit $fail
  assert-no-inline-directives:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@main
      - name: Assert no inline lint or format directives in Rust
        run: |
          fail=0
          pattern='#!?\[(allow|expect|warn|deny|forbid|rustfmt::skip)\b|#!?\[cfg_attr\('
          while IFS=: read -r f n text
          do
            echo "::error file=$f,line=$n::$f sets a lint level or skips" \
              "rustfmt inline; lint levels live in Cargo.toml and" \
              "thresholds in etc/clippy, so fix the code instead"
            fail=1
          done < <(git ls-files -z '*.rs' | xargs -0 -r grep -nE "$pattern" || true)
          exit $fail
  assert-no-linter-config-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@main
      - name: Install tools
        run: pip install assert-no-linter-config-files
      - if: ${{ !cancelled() }}
        name: Assert no linter config files
        run: >-
          assert-no-linter-config-files
          --linters mypy,pylint,yamllint
          --verbose
          ${{ github.workspace }}
      - if: ${{ !cancelled() }}
        name: Assert no rustfmt or clippy config outside etc/clippy
        run: |
          fail=0
          for f in $(find . -path ./.git -prune -o -path ./target -prune -o \
                       \( -name rustfmt.toml -o -name .rustfmt.toml \
                          -o -name clippy.toml -o -name .clippy.toml \) -print)
          do
            case "$f" in
              ./etc/clippy/src/clippy.toml|./etc/clippy/test/clippy.toml) ;;
              *)
                echo "::error file=$f::$f configures a Rust linter or" \
                  "formatter; rustfmt runs with the Rust Style Guide defaults," \
                  "and clippy thresholds live only in etc/clippy"
                fail=1
                ;;
            esac
          done
          exit $fail
  assert-no-oversized-source-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@main
      - name: Check file line limits
        run: |
          fail=0
          for f in $(git ls-files '*.rs')
          do
            lines=$(wc -l < "$f" | tr -d " ")
            if [ "$lines" -gt 1000 ]; then
              echo "::error file=$f,line=$lines::$f has $lines lines (max 1000); split it before adding to it"
              fail=1
            fi
          done
          exit $fail
  assert-one-assert-per-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@main
      - name: Assert one assert per test
        uses: 10U-Labs/assert-one-assert-per-test@latest
        with:
          files: src test
          verbose: "true"
  build-harness-img:
    name: build-harness-img-${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@main
      - name: Expose the Actions cache to docker build
        uses: crazy-max/ghaction-github-runtime@master
      - env:
          SCOPE: harness-${{ matrix.arch }}
        name: Build the coding harness image and save its layers to the Actions cache
        run: >-
          docker build
          --cache-from "type=gha,scope=$SCOPE"
          --cache-to "type=gha,mode=max,scope=$SCOPE"
          -t rustyhgm-harness-cache:latest
          .
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            platform: linux-x86-64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux-arm64
            runner: ubuntu-26.04-arm
  build-polyglot-base-img:
    name: build-polyglot-base-img-${{ matrix.platform }}
    permissions:
      contents: read
      packages: write
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@main
      - id: images
        name: Work out the polyglot image names
        uses: ./.github/actions/polyglot-images
        with:
          arch: ${{ matrix.arch }}
      - env:
          IMAGE: ${{ steps.images.outputs.base }}
        id: published
        name: Look for the base image on GHCR without logging in
        run: |
          if docker manifest inspect "$IMAGE" > /dev/null; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - env:
          IMAGE: ${{ steps.images.outputs.base }}
          PLATFORM: ${{ matrix.docker_platform }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        if: steps.published.outputs.found == 'false'
        name: Build the base image
        run: |
          mkdir context
          cp src/bench/polyglot_images/base.Dockerfile context/Dockerfile
          docker build \
            --platform "$PLATFORM" \
            --label "org.opencontainers.image.source=$SOURCE" \
            -t "$IMAGE" \
            context
      - env:
          ACTOR: ${{ github.actor }}
          IMAGE: ${{ steps.images.outputs.base }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: steps.published.outputs.found == 'false'
        name: Publish the base image and pull it back without logging in
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker push "$IMAGE"
          docker logout ghcr.io
          docker pull "$IMAGE"
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            docker_platform: linux/x86_64
            platform: linux-x86-64
            runner: ubuntu-latest
          - arch: arm64
            docker_platform: linux/arm64/v8
            platform: linux-arm64
            runner: ubuntu-26.04-arm
  build-polyglot-env-img:
    name: build-polyglot-env-img-${{ matrix.platform }}
    needs: build-polyglot-base-img
    permissions:
      contents: read
      packages: write
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@main
      - id: images
        name: Work out the polyglot image names
        uses: ./.github/actions/polyglot-images
        with:
          arch: ${{ matrix.arch }}
      - env:
          IMAGE: ${{ steps.images.outputs.env }}
        id: published
        name: Look for the env image on GHCR without logging in
        run: |
          if docker manifest inspect "$IMAGE" > /dev/null; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - env:
          BASE: ${{ steps.images.outputs.base }}
          IMAGE: ${{ steps.images.outputs.env }}
          LOCAL_BASE: ${{ steps.images.outputs.local_base }}
          PLATFORM: ${{ matrix.docker_platform }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        if: steps.published.outputs.found == 'false'
        name: Build the env image
        run: |
          docker pull "$BASE"
          docker tag "$BASE" "$LOCAL_BASE"
          mkdir context
          sed -e "s|{platform}|$PLATFORM|" -e "s|{base_image}|$LOCAL_BASE|" \
            src/bench/polyglot_images/env.Dockerfile > context/Dockerfile
          cp src/bench/polyglot_images/setup_env.sh context/
          docker build \
            --platform "$PLATFORM" \
            --label "org.opencontainers.image.source=$SOURCE" \
            -t "$IMAGE" \
            context
      - env:
          ACTOR: ${{ github.actor }}
          IMAGE: ${{ steps.images.outputs.env }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: steps.published.outputs.found == 'false'
        name: Publish the env image and pull it back without logging in
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker push "$IMAGE"
          docker logout ghcr.io
          docker pull "$IMAGE"
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            docker_platform: linux/x86_64
            platform: linux-x86-64
            runner: ubuntu-latest
          - arch: arm64
            docker_platform: linux/arm64/v8
            platform: linux-arm64
            runner: ubuntu-26.04-arm
  build-release:
    name: build-release-${{ matrix.platform }}
    needs:
      - e2e-test
      - integration-test
      - unit-test
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@main
      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache the build
        uses: Swatinem/rust-cache@master
        with:
          key: release-${{ matrix.platform }}
      - name: Build the release binary
        run: cargo build --release -p rustyhgm --bin rustyhgm
      - name: Stage the release binary
        run: |
          mkdir dist
          cp target/release/rustyhgm "dist/rustyhgm-${{ matrix.platform }}"
      - name: Upload the release binary
        uses: actions/upload-artifact@main
        with:
          name: release-${{ matrix.platform }}
          path: dist/
          retention-days: 1
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86-64
            runner: ubuntu-latest
          - platform: linux-arm64
            runner: ubuntu-26.04-arm
  build-test-binaries:
    name: build-test-binaries-${{ matrix.platform }}
    needs: assert-coverage
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@main
      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache the build
        uses: Swatinem/rust-cache@master
        with:
          key: ${{ matrix.platform }}
      - name: Install cargo-nextest
        uses: taiki-e/install-action@main
        with:
          tool: cargo-nextest
      - name: Build every test binary into an archive
        run: cargo nextest archive --workspace --all-targets --archive-file build.tar.zst
      - name: Upload build
        uses: actions/upload-artifact@main
        with:
          name: build-${{ matrix.platform }}
          path: build.tar.zst
          retention-days: 1
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86-64
            runner: ubuntu-latest
          - platform: linux-arm64
            runner: ubuntu-26.04-arm
  build-test-binaries-with-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@main
      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools
      - name: Install cargo-llvm-cov and cargo-nextest
        uses: taiki-e/install-action@main
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - name: Cache the build
        uses: Swatinem/rust-cache@master
      - name: Build every test binary with coverage instrumentation into an archive
        run: >-
          cargo llvm-cov nextest-archive
          --workspace
          --all-targets
          --archive-file build-coverage.tar.zst
      - name: Upload the instrumented build
        uses: actions/upload-artifact@main
        with:
          name: build-coverage
          path: build-coverage.tar.zst
          retention-days: 1
  clippy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@main
      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache the build
        uses: Swatinem/rust-cache@master
      - env:
          CLIPPY_CONF_DIR: ${{ github.workspace }}/etc/clippy/src
        if: ${{ !cancelled() }}
        name: Run clippy on src with the src thresholds
        run: cargo clippy --workspace --lib --bins -- -D warnings
      - env:
          CLIPPY_CONF_DIR: ${{ github.workspace }}/etc/clippy/test
        if: ${{ !cancelled() }}
        name: Run clippy on test with the test thresholds
        run: cargo clippy --workspace --tests -- -D warnings
  e2e-test:
    name: e2e-test-${{ matrix.platform }}
    needs:
      - build-harness-img
      - build-polyglot-env-img
      - build-test-binaries
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@main
      - name: Expose the Actions cache to docker build
        uses: crazy-max/ghaction-github-runtime@master
      - env:
          SCOPE: harness-${{ matrix.arch }}
        name: Warm the local build cache from the coding harness image's layers
        run: >-
          docker build
          --cache-from "type=gha,scope=$SCOPE"
          -t rustyhgm-harness-cache:latest
          .
      - name: Download build
        uses: actions/download-artifact@main
        with:
          name: build-${{ matrix.platform }}
      - name: Install cargo-nextest
        uses: taiki-e/install-action@main
        with:
          tool: cargo-nextest
      - id: images
        name: Work out the polyglot image names
        uses: ./.github/actions/polyglot-images
        with:
          arch: ${{ matrix.arch }}
      - env:
          BASE: ${{ steps.images.outputs.base }}
          ENV: ${{ steps.images.outputs.env }}
          LOCAL_BASE: ${{ steps.images.outputs.local_base }}
          LOCAL_ENV: ${{ steps.images.outputs.local_env }}
        name: Pull the polyglot images without logging in, under the names rustyhgm looks for
        run: |
          docker pull "$BASE"
          docker tag "$BASE" "$LOCAL_BASE"
          docker pull "$ENV"
          docker tag "$ENV" "$LOCAL_ENV"
      - name: Run the e2e tier
        run: >-
          cargo-nextest nextest run
          --archive-file build.tar.zst
          --workspace-remap .
          --no-fail-fast
          -E 'binary(e2e)'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            platform: linux-x86-64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux-arm64
            runner: ubuntu-26.04-arm
  e2e-test-coverage:
    needs:
      - build-harness-img
      - build-polyglot-env-img
      - build-test-binaries-with-coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@main
      - name: Expose the Actions cache to docker build
        uses: crazy-max/ghaction-github-runtime@master
      - name: Warm the local build cache from the coding harness image's layers
        run: >-
          docker build
          --cache-from "type=gha,scope=harness-x86_64"
          -t rustyhgm-harness-cache:latest
          .
      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools
      - name: Install cargo-llvm-cov and cargo-nextest
        uses: taiki-e/install-action@main
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - name: Download the instrumented build
        uses: actions/download-artifact@main
        with:
          name: build-coverage
      - id: images
        name: Work out the polyglot image names
        uses: ./.github/actions/polyglot-images
        with:
          arch: x86_64
      - env:
          BASE: ${{ steps.images.outputs.base }}
          ENV: ${{ steps.images.outputs.env }}
          LOCAL_BASE: ${{ steps.images.outputs.local_base }}
          LOCAL_ENV: ${{ steps.images.outputs.local_env }}
        name: Pull the polyglot images without logging in, under the names rustyhgm looks for
        run: |
          docker pull "$BASE"
          docker tag "$BASE" "$LOCAL_BASE"
          docker pull "$ENV"
          docker tag "$ENV" "$LOCAL_ENV"
      - env:
          LLVM_PROFILE_FILE_NAME: e2e-%p-%m.profraw
        name: Run the e2e tier under coverage
        run: >-
          mkdir -p target/llvm-cov-target
          && cargo llvm-cov nextest
          --archive-file build-coverage.tar.zst
          --workspace-remap .
          --no-report
          --no-fail-fast
          -E 'binary(e2e)'
      - name: Upload the e2e profile data
        uses: actions/upload-artifact@main
        with:
          name: profraw-e2e
          path: target/llvm-cov-target/*.profraw
          retention-days: 1
  harness-subtree:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@main
      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build and test the harness subtree on its own
        run: test/harness-subtree.sh
  integration-test:
    name: integration-test-${{ matrix.platform }}
    needs: build-test-binaries
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@main
      - name: Download build
        uses: actions/download-artifact@main
        with:
          name: build-${{ matrix.platform }}
      - name: Install cargo-nextest
        uses: taiki-e/install-action@main
        with:
          tool: cargo-nextest
      - name: Run the integration tier
        run: >-
          cargo-nextest nextest run
          --archive-file build.tar.zst
          --workspace-remap .
          -E 'binary(integration)'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86-64
            runner: ubuntu-latest
          - platform: linux-arm64
            runner: ubuntu-26.04-arm
  integration-test-coverage:
    needs: build-test-binaries-with-coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@main
      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools
      - name: Install cargo-llvm-cov and cargo-nextest
        uses: taiki-e/install-action@main
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - name: Download the instrumented build
        uses: actions/download-artifact@main
        with:
          name: build-coverage
      - env:
          LLVM_PROFILE_FILE_NAME: integration-%p-%m.profraw
        name: Run the integration tier under coverage
        run: >-
          mkdir -p target/llvm-cov-target
          && cargo llvm-cov nextest
          --archive-file build-coverage.tar.zst
          --workspace-remap .
          --no-report
          -E 'binary(integration)'
      - name: Upload the integration profile data
        uses: actions/upload-artifact@main
        with:
          name: profraw-integration
          path: target/llvm-cov-target/*.profraw
          retention-days: 1
  package:
    needs: build-release
    outputs:
      version: ${{ steps.version.outputs.version }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@main
      - name: Download the release binaries
        uses: actions/download-artifact@main
        with:
          merge-multiple: true
          path: dist/
          pattern: release-*
      - id: version
        name: Generate version from UTC time
        run: >-
          echo "version=$(date -u +%Y%m%d%H%M%S)"
          >> $GITHUB_OUTPUT
      - env:
          VERSION: ${{ steps.version.outputs.version }}
        name: Build a .deb and an RPM for each platform
        run: |
          mkdir -p packages stage
          for pair in linux-x86-64:amd64 linux-arm64:arm64; do
            platform="${pair%%:*}"
            arch="${pair##*:}"
            cp "dist/rustyhgm-$platform" stage/rustyhgm
            for packager in deb rpm; do
              rm -rf out && mkdir out
              docker run --rm -v "$PWD:/work" -w /work \
                -e ARCH="$arch" -e VERSION="$VERSION" \
                goreleaser/nfpm:latest package \
                --config etc/nfpm/nfpm.yaml \
                --packager "$packager" \
                --target out/
              mv out/*."$packager" "packages/rustyhgm-$platform.$packager"
            done
          done
          ls -l packages
      - name: Upload the packages
        uses: actions/upload-artifact@main
        with:
          name: packages
          path: packages/
          retention-days: 1
  package-test:
    name: package-test-${{ matrix.platform }}-${{ matrix.format }}
    needs: package
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Download the packages
        uses: actions/download-artifact@main
        with:
          name: packages
          path: packages/
      - name: Install the package on a clean system and run it
        run: >-
          docker run --rm
          -v "$PWD/packages:/packages:ro"
          ${{ matrix.image }}
          sh -euc '${{ matrix.install }}
          /packages/rustyhgm-${{ matrix.platform }}.${{ matrix.format }}
          && rustyhgm --version
          && for c in docker git python3; do command -v "$c"; done'
    strategy:
      fail-fast: false
      matrix:
        include:
          - format: deb
            image: ubuntu:latest
            install: >-
              apt-get update
              && DEBIAN_FRONTEND=noninteractive apt-get install -y
            platform: linux-x86-64
            runner: ubuntu-latest
          - format: rpm
            image: fedora:latest
            install: dnf install -y
            platform: linux-x86-64
            runner: ubuntu-latest
          - format: deb
            image: ubuntu:latest
            install: >-
              apt-get update
              && DEBIAN_FRONTEND=noninteractive apt-get install -y
            platform: linux-arm64
            runner: ubuntu-26.04-arm
          - format: rpm
            image: fedora:latest
            install: dnf install -y
            platform: linux-arm64
            runner: ubuntu-26.04-arm
  release:
    if: >-
      github.ref_name == 'main'
      && github.event_name == 'push'
    needs:
      - harness-subtree
      - assert-file-and-registration-sets-agree
      - assert-no-comments
      - assert-no-empty-test-files
      - assert-no-inline-directives
      - assert-no-linter-config-files
      - assert-no-oversized-source-files
      - assert-one-assert-per-test
      - clippy
      - package-test
      - rustfmt
      - yamllint
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@main
        with:
          fetch-depth: 0
      - name: Download the release binaries
        uses: actions/download-artifact@main
        with:
          merge-multiple: true
          path: dist/
          pattern: release-*
      - name: Download the packages
        uses: actions/download-artifact@main
        with:
          name: packages
          path: dist/
      - name: Create tag
        run: >-
          git tag
          "v${{ needs.package.outputs.version }}"
      - name: Push tag
        run: >-
          git push origin
          "v${{ needs.package.outputs.version }}"
      - env:
          GH_TOKEN: ${{ github.token }}
        name: Create GitHub Release
        run: |
          gh release create \
            "v${{ needs.package.outputs.version }}" \
            --generate-notes \
            dist/*
      - name: Update latest tag
        run: |
          git tag -f latest
          git push origin latest --force
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@main
      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - if: ${{ !cancelled() }}
        name: Check the formatting of every crate against the Rust Style Guide
        run: cargo fmt --all --check
      - if: ${{ !cancelled() }}
        name: Check the formatting of every Rust file, reachable from a crate or not
        run: >-
          git ls-files -z '*.rs'
          | xargs -0 -r rustfmt --check --edition 2024
  unit-test:
    name: unit-test-${{ matrix.platform }}
    needs: build-test-binaries
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@main
      - name: Download build
        uses: actions/download-artifact@main
        with:
          name: build-${{ matrix.platform }}
      - name: Install cargo-nextest
        uses: taiki-e/install-action@main
        with:
          tool: cargo-nextest
      - name: Run the unit tier
        run: >-
          cargo-nextest nextest run
          --archive-file build.tar.zst
          --workspace-remap .
          --no-tests warn
          -E 'kind(lib) | kind(bin) | binary(unit)'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86-64
            runner: ubuntu-latest
          - platform: linux-arm64
            runner: ubuntu-26.04-arm
  unit-test-coverage:
    needs: build-test-binaries-with-coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@main
      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools
      - name: Install cargo-llvm-cov and cargo-nextest
        uses: taiki-e/install-action@main
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - name: Download the instrumented build
        uses: actions/download-artifact@main
        with:
          name: build-coverage
      - env:
          LLVM_PROFILE_FILE_NAME: unit-%p-%m.profraw
        name: Run the unit tier under coverage
        run: >-
          mkdir -p target/llvm-cov-target
          && cargo llvm-cov nextest
          --archive-file build-coverage.tar.zst
          --workspace-remap .
          --no-report
          --no-tests warn
          -E 'kind(lib) | kind(bin) | binary(unit)'
      - name: Upload the unit profile data
        uses: actions/upload-artifact@main
        with:
          name: profraw-unit
          path: target/llvm-cov-target/*.profraw
          retention-days: 1
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@main
      - name: Install tools
        run: pip install assert-no-inline-directives yamllint
      - if: ${{ !cancelled() }}
        name: Assert no inline yamllint disables
        run: >-
          assert-no-inline-directives
          --tools yamllint
          --verbose
          .github/actions
          .github/workflows/release.yml
      - if: ${{ !cancelled() }}
        name: Lint YAML
        run: |
          EMPTY='empty-lines: {max: 0, max-start: 0, max-end: 1}'
          KEY='key-ordering: enable'
          LL='line-length: disable'
          NL='new-line-at-end-of-file: enable'
          TR='truthy: {allowed-values: ["true", "false", "on"]}'
          RULES="$EMPTY, $KEY, $LL, $NL, $TR"
          yamllint --strict \
            --config-data \
            "{extends: default, rules: {$RULES}}" \
            .github/actions \
            .github/workflows/release.yml
name: release
on:
  push:
    branches: [main]
    paths:
      - .dockerignore
      - .github/actions/**
      - .github/workflows/release.yml
      - Cargo.toml
      - Dockerfile
      - etc/**
      - lib/**
      - rust-toolchain.toml
      - src/**
      - test/**
  workflow_dispatch: {}
