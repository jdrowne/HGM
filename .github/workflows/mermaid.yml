---
concurrency:
  cancel-in-progress: true
  group: mermaid-${{ github.ref }}
jobs:
  assert-no-comments:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@main
      - name: Assert no comments
        uses: 10U-Labs/assert-no-comments@latest
        with:
          trees: .github/workflows/mermaid.yml
          verbose: "true"
  mermaid:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@main
      - name: Install tools
        run: npm install -g @mermaid-js/mermaid-cli
      - name: Install the browser
        run: node "$(npm root -g)/@mermaid-js/mermaid-cli/node_modules/puppeteer/install.mjs"
      - name: Render the README diagrams
        run: |
          echo '{"args": ["--no-sandbox"]}' > "$RUNNER_TEMP/puppeteer.json"
          mmdc \
            --quiet \
            --puppeteerConfigFile "$RUNNER_TEMP/puppeteer.json" \
            --input README.md \
            --output "$RUNNER_TEMP/rendered.md"
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@main
      - name: Install tools
        run: pip install assert-no-inline-directives yamllint
      - if: ${{ !cancelled() }}
        name: Assert no inline yamllint disables
        run: >-
          assert-no-inline-directives
          --tools yamllint
          --verbose
          .github/workflows/mermaid.yml
      - if: ${{ !cancelled() }}
        name: Lint YAML
        run: |
          EMPTY='empty-lines: {max: 0, max-start: 0, max-end: 1}'
          KEY='key-ordering: enable'
          LL='line-length: disable'
          NL='new-line-at-end-of-file: enable'
          TR='truthy: {allowed-values: ["true", "false", "on"]}'
          RULES="$EMPTY, $KEY, $LL, $NL, $TR"
          yamllint --strict \
            --config-data \
            "{extends: default, rules: {$RULES}}" \
            .github/workflows/mermaid.yml
name: mermaid
on:
  push:
    branches:
      - main
    paths:
      - "README.md"
      - ".github/workflows/mermaid.yml"
  workflow_dispatch: {}
