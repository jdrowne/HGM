name: E2E

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

env:
  CARGO_TERM_COLOR: always

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@master
      - run: cargo test --test e2e
