---
concurrency:
  cancel-in-progress: true
  group: time-e2e-improve-${{ github.ref }}
jobs:
  time:
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@main
      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-nextest
        uses: taiki-e/install-action@main
        with:
          tool: cargo-nextest
      - name: Build the e2e tier
        run: cargo nextest archive -p rustyhgm --test e2e --archive-file build.tar.zst
      - name: Run the improvement scenario
        run: >-
          time cargo-nextest nextest run
          --archive-file build.tar.zst
          --workspace-remap .
          --no-fail-fast
          -E 'test(=improve::a_run_improves_the_agent_and_measures_its_child)'
      - if: ${{ !cancelled() }}
        name: Show when each stage started and ended
        run: |
          root=$(find "${TMPDIR:-/tmp}" -maxdepth 2 -type d -name 'attempt*' -path '*rustyhgm-e2e-improve-*' | head -n 1)
          echo "scenario: $root"
          find "$root" -name '*.log' -print0 | while IFS= read -r -d '' f; do
            first=$(grep -m1 -oE '^[0-9]{4}-[0-9]{2}-[0-9]{2}[ T][0-9:.,]+' "$f" || true)
            last=$(grep -oE '^[0-9]{4}-[0-9]{2}-[0-9]{2}[ T][0-9:.,]+' "$f" | tail -n 1 || true)
            printf '%s  %s  %s\n' "$first" "$last" "${f#"$root"/}"
          done | sort
      - if: ${{ !cancelled() }}
        name: Show the slowest Docker build steps
        run: |
          root=$(find "${TMPDIR:-/tmp}" -maxdepth 2 -type d -name 'attempt*' -path '*rustyhgm-e2e-improve-*' | head -n 1)
          find "$root" -name '*.log' -print0 | while IFS= read -r -d '' f; do
            awk -v f="${f#"$root"/}" '
              match($0, /#[0-9]+ \[[^]]*\] .*/) {
                s = substr($0, RSTART, RLENGTH); split(s, w, " "); name[w[1]] = substr(s, 1, 140)
              }
              match($0, /#[0-9]+ DONE [0-9.]+s/) {
                s = substr($0, RSTART, RLENGTH); split(s, w, " "); sub(/s$/, "", w[3])
                if (w[3] + 0 >= 5) printf "%8.1fs  %s  %s\n", w[3], f, (w[1] in name ? name[w[1]] : w[1])
              }
            ' "$f"
          done | sort -rn | head -n 60
      - if: ${{ !cancelled() }}
        name: Show the images
        run: docker image ls --format '{{.Repository}}:{{.Tag}} {{.Size}}'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86-64
            runner: ubuntu-latest
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
name: time-e2e-improve
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/time-e2e-improve.yml"
  workflow_dispatch: {}
