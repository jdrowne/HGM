name: loop-integration-arm64
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/loop-integration-arm64.yml
  workflow_dispatch: {}
jobs:
  loop:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Show the Docker engine
        run: docker version && docker info
      - name: Look the image up while concurrent builds retag it
        run: |
          mk() {
            d=$(mktemp -d)
            mkdir -p "$d/rustyhgm"
            : > "$d/rustyhgm/Cargo.toml"
            printf 'x\n' > "$d/git"
            printf 'y\n' > "$d/cargo"
            printf 'FROM busybox:latest\nCOPY rustyhgm /rustyhgm\nCOPY git cargo /usr/local/bin/\nCMD ["tail", "-f", "/dev/null"]\n' > "$d/Dockerfile"
            echo "$d"
          }
          docker pull -q busybox:latest
          misses=0
          for round in $(seq 1 30); do
            docker image rm -f rustyhgm-probe:latest > /dev/null 2>&1 || true
            [ "$round" -gt 15 ] && docker build -q -t rustyhgm-probe:latest "$(mk)" > /dev/null
            for i in $(seq 1 16); do
              docker build -q -t rustyhgm-probe:latest "$(mk)" > /dev/null 2>&1 &
            done
            seen=0
            while [ -n "$(jobs -rp)" ]; do
              if docker image inspect --format '{{.Id}}' rustyhgm-probe:latest > /dev/null 2>&1; then
                seen=1
              elif [ "$seen" = 1 ]; then
                misses=$((misses+1))
                echo "round $round: the image went missing after it existed"
              fi
            done
            wait
          done
          echo "lookups that missed an image that had existed: $misses"
    timeout-minutes: 60
