[package]
name = "rustyhgm"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
path = "lib.rs"

[[bin]]
name = "rustyhgm"
path = "main.rs"

[[test]]
name = "unit"
path = "../../test/src/rustyhgm/unit/main.rs"

[[test]]
name = "integration"
path = "../../test/src/rustyhgm/integration/main.rs"

[[test]]
name = "e2e"
path = "../../test/src/rustyhgm/e2e/main.rs"

[dependencies]
chrono = "*"
clap = { version = "*", features = ["derive"] }
rustyhgm-coding-harness = { path = "../coding-harness" }
rustyhgm-bench = { path = "../bench" }
rustyhgm-core = { path = "../core" }
rustyhgm-sandbox = { path = "../sandbox" }
include_dir = "*"
rand = "*"
serde_json = { version = "*", features = ["preserve_order"] }
statrs = "*"
tempfile = "*"
uuid = { version = "*", features = ["v4"] }

[dev-dependencies]
serde_json = { version = "*", features = ["preserve_order"] }
tempfile = "*"
