[package]
name = "hgm-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
path = "lib.rs"

[[bin]]
name = "hgm-agent"
path = "main.rs"

[[test]]
name = "unit"
path = "../../test/src/agent/unit/main.rs"

[[test]]
name = "integration"
path = "../../test/src/agent/integration/main.rs"

[dependencies]
regex = "*"
serde_json = { version = "*", features = ["preserve_order"] }
ureq = { version = "*", features = ["json"] }

[dev-dependencies]
serde_json = { version = "*", features = ["preserve_order"] }
