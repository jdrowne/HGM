[package]
name = "hgm-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[dependencies]
chrono = "*"
rand = "*"
rand_distr = "*"
serde = { version = "*", features = ["derive"] }
serde_json = { version = "*", features = ["preserve_order"] }
serde_norway = "*"

[dev-dependencies]
serde_json = "*"
tempfile = "*"

[[test]]
name = "unit"
path = "../../test/src/core/unit/main.rs"
