[package]
name = "rustyhgm-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
path = "lib.rs"

[[test]]
name = "unit"
path = "../../test/src/bench/unit/main.rs"

[[test]]
name = "integration"
path = "../../test/src/bench/integration/main.rs"

[dependencies]
chrono = "*"
rustyhgm-coding-harness = { path = "../coding-harness" }
rustyhgm-core = { path = "../core" }
rustyhgm-sandbox = { path = "../sandbox" }
parquet = { version = "*", default-features = false, features = ["snap"] }
serde = { version = "*", features = ["derive"] }
serde_json = { version = "*", features = ["preserve_order"] }
sha2 = "*"
ureq = { version = "*", features = ["json"] }

[dev-dependencies]
serde_json = { version = "*", features = ["preserve_order"] }
tempfile = "*"
