[package]
name = "hgm-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
path = "lib.rs"

[[test]]
name = "unit"
path = "../../test/src/bench/unit/main.rs"

[[test]]
name = "integration"
path = "../../test/src/bench/integration/main.rs"

[dependencies]
chrono = "*"
hgm-agent = { path = "../agent" }
hgm-core = { path = "../core" }
hgm-sandbox = { path = "../sandbox" }
parquet = { version = "*", default-features = false, features = ["snap"] }
serde = { version = "*", features = ["derive"] }
serde_json = { version = "*", features = ["preserve_order"] }
ureq = { version = "*", features = ["json"] }

[dev-dependencies]
serde_json = { version = "*", features = ["preserve_order"] }
tempfile = "*"
