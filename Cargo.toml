[workspace]
# Glob members: a checkout that holds only the agent subtree (src/agent,
# lib/agent and their tests) is still a valid workspace.
members = ["src/*", "lib/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false
