[workspace]
members = ["src/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.lints.rust]
nonstandard_style = { level = "deny", priority = -1 }

[workspace.lints.clippy]
cognitive_complexity = "warn"
excessive_nesting = "warn"
too_many_arguments = "warn"
too_many_lines = "warn"
