llm:
  self_improve_llm: "gpt-5-mini"
  downstream_llm: "gpt-5-mini"
  diagnose_llm: "gpt-5-mini"

optimization:
  alpha: 0.6
  beta: 1.0
  cool_down: false
  eval_random_level: 1.0
  n_pseudo_descendant_evals: 10000

execution:
  max_workers: 20
  self_improve_timeout: 3600
  evaluation_timeout: 3600
  max_task_evals: 800

evaluation:
  full_eval: false
  polyglot: false

paths:
  output_dir: null
  continue_from: null
  initial_agent_name: "default_agent"
