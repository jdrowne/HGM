name: rustyhgm
arch: ${ARCH}
platform: linux
version: ${VERSION}
version_schema: none
maintainer: jdrowne <jdrowne@users.noreply.github.com>
description: A Rust port of the Huxley-Gödel Machine, which improves a coding harness by having it rewrite its own source
homepage: https://github.com/jdrowne/RustyHGM
license: Apache-2.0
contents:
  - src: stage/rustyhgm
    dst: /usr/bin/rustyhgm
    file_info:
      mode: 0755
overrides:
  deb:
    depends:
      - docker.io | docker-ce-cli | docker-cli | podman-docker
      - git
      - python3
  rpm:
    depends:
      - /usr/bin/docker
      - /usr/bin/git
      - /usr/bin/python3
